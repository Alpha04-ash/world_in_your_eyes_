<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050713">
  <title>Письма от Робии • Панель автора</title>

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&subset=cyrillic,cyrillic-ext&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050713;
      color: #fcf9f2;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(229, 197, 131, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(243, 182, 198, 0.08) 0%, transparent 50%);
    }

    .admin-container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Auth Screen */
    .auth-card {
      background: rgba(18, 24, 48, 0.85);
      border: 1px solid rgba(229, 197, 131, 0.35);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      max-width: 420px;
      margin: 15vh auto 0;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(229, 197, 131, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .auth-crest {
      font-size: 2rem;
      color: #e5c583;
      margin-bottom: 12px;
    }

    .auth-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.1rem;
      font-weight: 400;
      color: #fcf9f2;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 0.82rem;
      color: rgba(251, 248, 242, 0.65);
      margin-bottom: 24px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(7, 10, 26, 0.8);
      border: 1px solid rgba(229, 197, 131, 0.4);
      border-radius: 30px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
      letter-spacing: 0.15em;
      margin-bottom: 18px;
      transition: all 0.3s;
    }

    .auth-input:focus {
      border-color: #fcedb6;
      box-shadow: 0 0 25px rgba(229, 197, 131, 0.35);
    }

    .btn-auth {
      width: 100%;
      padding: 14px 28px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(229, 197, 131, 0.3) 0%, rgba(243, 182, 198, 0.25) 100%);
      border: 1px solid #e5c583;
      color: #fcf9f2;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-auth:hover {
      background: linear-gradient(135deg, #e5c583 0%, #f3b6c6 100%);
      color: #050713;
      transform: translateY(-2px);
    }

    .auth-error {
      color: #e65c7b;
      font-size: 0.82rem;
      margin-top: 12px;
      display: none;
    }

    /* Dashboard */
    .dashboard {
      display: none;
    }

    .dashboard.active {
      display: block;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
      gap: 14px;
    }

    .dash-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 400;
      color: #e5c583;
    }

    .dash-sub {
      font-size: 0.82rem;
      color: rgba(251, 248, 242, 0.65);
      margin-top: 2px;
    }

    .dash-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-dash {
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(18, 24, 48, 0.8);
      border: 1px solid rgba(229, 197, 131, 0.35);
      color: #fcf9f2;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s;
    }

    .btn-dash:hover {
      border-color: #e5c583;
      transform: translateY(-1px);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .sync-pulse {
      width: 7px;
      height: 7px;
      background: #34d399;
      border-radius: 50%;
      animation: pulseSync 2s infinite;
    }

    @keyframes pulseSync {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    /* Letters List */
    .letters-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .letter-item {
      background: rgba(18, 24, 48, 0.85);
      border: 1px solid rgba(229, 197, 131, 0.3);
      border-radius: 20px;
      padding: 22px 24px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(15px);
      transition: transform 0.3s;
      animation: fadeIn 0.4s ease;
    }

    .letter-item:hover {
      transform: translateY(-2px);
      border-color: #e5c583;
    }

    .letter-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
      gap: 8px;
    }

    .letter-mood {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(229, 197, 131, 0.2) 0%, rgba(243, 182, 198, 0.2) 100%);
      border: 1px solid #e5c583;
      font-size: 0.78rem;
      font-weight: 600;
      color: #fcedb6;
    }

    .letter-date {
      font-size: 0.75rem;
      color: rgba(251, 248, 242, 0.5);
    }

    .letter-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.25rem;
      font-style: italic;
      line-height: 1.6;
      color: #fcf9f2;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 14px;
    }

    .letter-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-action {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(251, 248, 242, 0.7);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      border-color: #e5c583;
      color: #fff;
    }

    .btn-action.delete:hover {
      border-color: #e65c7b;
      color: #e65c7b;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: rgba(14, 18, 38, 0.6);
      border: 1px dashed rgba(229, 197, 131, 0.25);
      border-radius: 24px;
    }

    .empty-icon {
      font-size: 2.5rem;
      color: #e5c583;
      margin-bottom: 12px;
    }

    .empty-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #fcf9f2;
    }

    .empty-desc {
      font-size: 0.88rem;
      color: rgba(251, 248, 242, 0.65);
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <!-- Экран авторизации -->
    <div id="authScreen" class="auth-card">
      <div class="auth-crest">✦ ✧ ✦</div>
      <h1 class="auth-title">Вход для автора</h1>
      <p class="auth-sub">Тайный поклонник • Письма от Робии</p>
      
      <input type="password" id="authPassword" class="auth-input" placeholder="Введи пароль" autofocus>
      <button id="btnAuthSubmit" class="btn-auth">ОТКРЫТЬ ПИСЬМА →</button>
      <p id="authError" class="auth-error">Неверный пароль. Попробуй ещё раз.</p>
    </div>

    <!-- Главная панель с письмами -->
    <div id="dashboardScreen" class="dashboard">
      <div class="dash-header">
        <div>
          <h1 class="dash-title">Письма от Робии ✨</h1>
          <p class="dash-sub">Здесь отображаются все мысли и слова, которые отправила Робия</p>
        </div>

        <div class="dash-controls">
          <span class="sync-badge">
            <span class="sync-pulse"></span>
            Облако активно
          </span>
          <button id="btnRefresh" class="btn-dash" title="Обновить список">↻ Обновить</button>
          <button id="btnTestSend" class="btn-dash" title="Отправить тестовое письмо">+ Тест</button>
          <button id="btnLogout" class="btn-dash" title="Выйти">Выйти</button>
        </div>
      </div>

      <!-- Список писем -->
      <div id="lettersList" class="letters-list">
        <!-- Генерируется через JS -->
      </div>
    </div>

  </div>

  <script>
    const VALID_PASSWORDS = ['abubakr', 'robiya2026', 'admin'];
    const NTFY_TOPIC = 'robiya_secret_letters_abubakr_2026';

    const authScreen = document.getElementById('authScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const authPassword = document.getElementById('authPassword');
    const btnAuthSubmit = document.getElementById('btnAuthSubmit');
    const authError = document.getElementById('authError');

    const lettersList = document.getElementById('lettersList');
    const btnRefresh = document.getElementById('btnRefresh');
    const btnTestSend = document.getElementById('btnTestSend');
    const btnLogout = document.getElementById('btnLogout');

    // Проверка сохраненной сессии
    if (sessionStorage.getItem('admin_authenticated') === 'true') {
      showDashboard();
    }

    function checkAuth() {
      const val = (authPassword.value || '').trim().toLowerCase();
      if (VALID_PASSWORDS.includes(val)) {
        sessionStorage.setItem('admin_authenticated', 'true');
        showDashboard();
      } else {
        authError.style.display = 'block';
        authPassword.style.borderColor = '#e65c7b';
      }
    }

    btnAuthSubmit.addEventListener('click', checkAuth);
    authPassword.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAuth();
    });

    btnLogout.addEventListener('click', () => {
      sessionStorage.removeItem('admin_authenticated');
      dashboardScreen.classList.remove('active');
      authScreen.style.display = 'block';
      authPassword.value = '';
    });

    function showDashboard() {
      authScreen.style.display = 'none';
      dashboardScreen.classList.add('active');
      loadAllLetters();
    }

    // Загрузка писем из LocalStorage и Облака NTFY
    async function loadAllLetters() {
      let letters = [];

      // 1. Читаем из LocalStorage
      try {
        const local = JSON.parse(localStorage.getItem('robiya_secret_letters') || '[]');
        if (Array.isArray(local)) letters.push(...local);
      } catch (e) {}

      // 2. Читаем из облачного шлюза ntfy
      try {
        const res = await fetch(`https://ntfy.sh/${NTFY_TOPIC}/json?poll=1`);
        if (res.ok) {
          const lines = (await res.text()).trim().split('\n');
          lines.forEach(line => {
            if (!line) return;
            try {
              const data = JSON.parse(line);
              if (data.event === 'message') {
                letters.push({
                  id: data.id,
                  date: new Date(data.time * 1000).toLocaleString('ru-RU', {
                    day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
                  }),
                  mood: '💌 Облачное письмо',
                  message: data.message,
                  timestamp: data.time * 1000
                });
              }
            } catch (err) {}
          });
        }
      } catch (e) {
        console.warn('Облачный запрос недоступен:', e);
      }

      // Удаляем дубликаты по timestamp/message
      const uniqueMap = new Map();
      letters.forEach(item => {
        const key = item.message.slice(0, 50) + (item.timestamp || item.date);
        if (!uniqueMap.has(key)) {
          uniqueMap.set(key, item);
        }
      });

      const uniqueLetters = Array.from(uniqueMap.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      renderLetters(uniqueLetters);
    }

    function renderLetters(letters) {
      lettersList.innerHTML = '';

      if (!letters || letters.length === 0) {
        lettersList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">✉️</div>
            <h3 class="empty-title">Робия ещё не отправила письмо</h3>
            <p class="empty-desc">
              Как только она дойдёт до конца истории и нажмёт «Отправить письмо в небо», её слова и реакция появятся здесь мгновенно!
            </p>
          </div>
        `;
        return;
      }

      letters.forEach((l, idx) => {
        const item = document.createElement('div');
        item.className = 'letter-item';
        item.innerHTML = `
          <div class="letter-meta">
            <span class="letter-mood">${escapeHtml(l.mood || '🌸 Ответ')}</span>
            <span class="letter-date">${escapeHtml(l.date || 'Только что')}</span>
          </div>
          <p class="letter-text">«${escapeHtml(l.message)}»</p>
          <div class="letter-actions">
            <button class="btn-action copy" onclick="copyLetterText('${escapeHtml(l.message)}')">Копировать</button>
            <button class="btn-action delete" onclick="deleteLocalLetter(${idx})">Удалить</button>
          </div>
        `;
        lettersList.appendChild(item);
      });
    }

    window.copyLetterText = function(text) {
      navigator.clipboard.writeText(text);
      alert('Текст письма скопирован в буфер обмена!');
    };

    window.deleteLocalLetter = function(idx) {
      if (!confirm('Удалить эту запись?')) return;
      try {
        const local = JSON.parse(localStorage.getItem('robiya_secret_letters') || '[]');
        local.splice(idx, 1);
        localStorage.setItem('robiya_secret_letters', JSON.stringify(local));
      } catch (e) {}
      loadAllLetters();
    };

    btnRefresh.addEventListener('click', loadAllLetters);

    // Тест-отправка для проверки
    btnTestSend.addEventListener('click', () => {
      const sample = {
        id: 'letter_' + Date.now(),
        date: new Date().toLocaleString('ru-RU', {
          day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
        }),
        mood: '✨ Мне приятно',
        message: 'Спасибо за такой невероятно красивый сайт... У меня не хватает слов, чтобы описать, насколько это тронуло моё сердце.',
        timestamp: Date.now()
      };
      const local = JSON.parse(localStorage.getItem('robiya_secret_letters') || '[]');
      local.unshift(sample);
      localStorage.setItem('robiya_secret_letters', JSON.stringify(local));
      loadAllLetters();
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Авто-опрос каждые 15 секунд
    setInterval(() => {
      if (dashboardScreen.classList.contains('active')) {
        loadAllLetters();
      }
    }, 15000);
  </script>
</body>
</html>
